name: SANA Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'branding/**'
      - 'build/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

concurrency:
  group: sana-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout SANA distribution config
        uses: actions/checkout@v7.0.1
        with:
          path: sana-config

      - name: Checkout pinned official VS Code source
        uses: actions/checkout@v7.0.1
        with:
          repository: microsoft/vscode
          ref: 661626d0e72f97806550790a98fb87116c9db825
          path: upstream-vscode
          fetch-depth: 1

      - name: Verify upstream source identity
        shell: pwsh
        run: |
          $expected = '661626d0e72f97806550790a98fb87116c9db825'
          $actual = (git -C upstream-vscode rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Upstream SHA mismatch. Expected $expected but received $actual" }
          if (-not (Test-Path 'upstream-vscode/product.json')) { throw 'The checkout is not a VS Code source tree.' }
          "SANA uses official microsoft/vscode commit $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'

      - name: Install pinned pnpm
        shell: pwsh
        run: |
          npm install --global pnpm@12.16.0
          pnpm --version

      - name: Install VS Code build dependencies
        working-directory: upstream-vscode
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile

      - name: Apply SANA product identity
        working-directory: sana-config
        shell: pwsh
        run: |
          $env:VSCODE_SOURCE_DIR = (Resolve-Path '../upstream-vscode').Path
          node build/prepare-sana.mjs

      - name: Validate build configuration and update tooling
        working-directory: sana-config
        shell: pwsh
        run: |
          node --check build/prepare-sana.mjs
          node --check updates/create-manifest.mjs
          node --check updates/verify-update.mjs
          $schema = Get-Content updates/manifest.schema.json -Raw | ConvertFrom-Json
          if ($schema.title -ne 'SANA Update Manifest v1') { throw 'Unexpected update manifest schema.' }
          $product = Get-Content ../upstream-vscode/product.json -Raw | ConvertFrom-Json
          if ($product.nameShort -ne 'SANA') { throw 'SANA product branding was not applied.' }

      - name: Test signed update tooling
        working-directory: sana-config
        shell: pwsh
        run: |
          node --test tests/update-tools.test.mjs

      - name: Add Windows SDK SignTool to PATH
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $sdkRoot = Join-Path $programFilesX86 'Windows Kits/10/bin'
          if (-not (Test-Path $sdkRoot)) { throw "Windows SDK bin directory not found: $sdkRoot" }
          $signTools = Get-ChildItem -Path $sdkRoot -Filter signtool.exe -File -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending
          if (-not $signTools) { throw "x64 signtool.exe was not found under $sdkRoot" }
          $signToolDir = $signTools[0].Directory.FullName
          Write-Host "Using Windows SDK SignTool: $($signTools[0].FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $signToolDir

      - name: Build official VS Code Windows x64 distribution
        working-directory: upstream-vscode
        shell: pwsh
        run: |
          npm run gulp -- vscode-win32-x64

      - name: Verify and sanitize packaged executable
        shell: pwsh
        run: |
          $packageDir = 'VSCode-win32-x64'
          if (-not (Test-Path $packageDir)) {
            Get-ChildItem -Path . -Directory | Select-Object Name | Format-Table | Out-String | Write-Host
            throw "VS Code package directory was not created: $packageDir"
          }
          $exe = Get-ChildItem -Path $packageDir -File -Filter '*.exe' |
            Where-Object { $_.Name -notmatch '^(unins|uninstall|elevate|crashpad)' } |
            Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Path $packageDir -Recurse -File -Filter '*.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 50 FullName | Format-Table | Out-String | Write-Host
            throw "No application executable found in $packageDir"
          }
          $extensionsDir = Join-Path $packageDir 'resources/app/extensions'
          $copilotPaths = @(
            (Join-Path $extensionsDir 'copilot'),
            (Join-Path $extensionsDir 'copilot-chat')
          )
          foreach ($copilotPath in $copilotPaths) {
            if (Test-Path $copilotPath) {
              Remove-Item -LiteralPath $copilotPath -Recurse -Force
              Write-Host "Removed packaged Copilot extension: $copilotPath"
            }
          }
          foreach ($copilotPath in $copilotPaths) {
            if (Test-Path $copilotPath) { throw "Copilot extension remains in package: $copilotPath" }
          }
          Write-Host "Verified application executable: $($exe.FullName)"
          Write-Host 'Packaged Copilot extension folders are absent.'

      - name: Upload unsigned engineering build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sana-engineering-build-${{ github.sha }}
          path: |
            VSCode-win32-x64/**
            !VSCode-win32-x64/resources/app/node_modules
          if-no-files-found: error
          retention-days: 7

      - name: Release readiness notice
        shell: pwsh
        run: |
          @'
          This is an unsigned engineering build from the pinned official Code - OSS source.
          SANA License runtime integration, complete Agents/Copilot removal audit,
          branded icon resource wiring, installer packaging, and signed updater integration
          remain release gates. This workflow intentionally does not publish a public release.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
